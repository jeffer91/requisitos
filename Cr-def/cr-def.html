<!doctype html>
<!-- =========================================================
Nombre completo: cr-def.html
Ruta: /Requisitos/Cr-def/cr-def.html
Función:
- Mesa de programación editable para defensas.
- Fecha por carrera, hora y responsables por estudiante.
- Guardado automático en BDLocal.
========================================================= -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cr-def · Cronograma de defensas</title>
  <link rel="stylesheet" href="cr-def.css" />
  <link rel="stylesheet" href="cr-def.scheduler.css" />
  <link rel="stylesheet" href="cr-def.render.css" />
</head>
<body>
  <main class="cr-shell" data-cr-def-app>
    <section class="cr-toolbar cr-toolbar--main" aria-label="Filtros del cronograma">
      <div class="cr-filter-box cr-filter-period">
        <label for="crPeriodo">Período</label>
        <select id="crPeriodo" class="cr-control" data-cr-periodo>
          <option value="">Seleccione período</option>
        </select>
      </div>

      <div class="cr-search-box">
        <label for="crBusqueda">Buscar</label>
        <input id="crBusqueda" class="cr-control" type="search"
          placeholder="Estudiante, carrera, sede, aula o tribunal"
          autocomplete="off" data-cr-busqueda />
      </div>

      <div class="cr-filter-box">
        <label for="crFiltroCarrera">Carrera</label>
        <select id="crFiltroCarrera" class="cr-control" data-cr-filtro-carrera>
          <option value="">Todas</option>
        </select>
      </div>

      <div class="cr-filter-box">
        <label for="crFiltroSede">Sede</label>
        <select id="crFiltroSede" class="cr-control" data-cr-filtro-sede>
          <option value="">Todas</option>
        </select>
      </div>

      <div class="cr-filter-box">
        <label for="crFiltroEstado">Estado</label>
        <select id="crFiltroEstado" class="cr-control" data-cr-filtro-estado>
          <option value="">Todos</option>
          <option value="apto">Apto para agendar</option>
          <option value="programado">Defensa programada</option>
          <option value="supletorio">Supletorio / segunda defensa</option>
          <option value="conflicto">Con conflicto</option>
        </select>
      </div>

      <div class="cr-toolbar-actions">
        <button type="button" class="cr-btn cr-btn--soft" data-cr-actualizar disabled>Actualizar</button>
        <button type="button" class="cr-btn" data-cr-exportar disabled>Exportar</button>
        <span class="cr-save-status" data-cr-save-status>Guardado automático</span>
      </div>
    </section>

    <section class="cr-status-panel" data-cr-status-panel hidden aria-live="polite">
      <article class="cr-alert cr-alert--warn" data-cr-alerta-principal></article>
    </section>

    <section class="cr-table-card">
      <div class="cr-table-card__head">
        <h2>Cronograma</h2>
        <span class="cr-pill" data-cr-cache-status>Preparando datos</span>
      </div>

      <div class="cr-table-wrap">
        <table class="cr-table" aria-label="Cronograma de defensas">
          <thead>
            <tr>
              <th>Día</th>
              <th>Hora</th>
              <th>Sede</th>
              <th>Nombres completos</th>
              <th>Carrera</th>
              <th>Tribunal 1 / Coordinador</th>
              <th>Tribunal 2</th>
              <th>Investigador</th>
              <th>Aula</th>
            </tr>
          </thead>
          <tbody data-cr-tabla-body>
            <tr class="cr-empty-row">
              <td colspan="9">Selecciona un período.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <datalist id="crPeopleCatalog" data-cr-people-catalog></datalist>
  </main>

  <script src="../BDLocal/adapters/bdl.screen-deps.js"></script>
  <script src="../BDLocal/conexiones/cone.crdef.js"></script>
  <script src="cr-def.config.js"></script>
  <script src="cr-def.rules.js"></script>
  <script src="cr-def.templates.js"></script>
  <script src="cr-def.cache.js"></script>
  <script src="cr-def.data.js"></script>
  <script src="cr-def.scheduler.js"></script>
  <script src="cr-def.bootstrap.js"></script>
</body>
</html>
