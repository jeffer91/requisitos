name: Carga audit temporal

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-carga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Verificar sintaxis y estructura
        run: |
          node scripts/verify-carga-audit-temp.js
          node scripts/verify-carga-save-v2.js
          node --check Carga/carga.app.connector.js
          node --check Carga/carga.divisiones.popup.js
          node --check Carga/carga.index.js
          node --check Carga/carga.ui.connector.js
          node --check Carga/mapping/carga.field-map.js
          node --check Carga/process/carga.normalizer.js
          node --check Carga/process/carga.save.js
          node --check Carga/readers/carga.reader.csv.js
          node --check Carga/readers/carga.reader.file.js
          node --check Carga/readers/carga.reader.txt.js
          node --check Carga/readers/carga.reader.xlsx.js
