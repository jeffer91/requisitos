name: Carga benchmark temporal

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark-carga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Medir 100000 filas
        run: node scripts/benchmark-carga-temp.js
